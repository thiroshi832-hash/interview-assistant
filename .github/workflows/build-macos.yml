name: Build macOS app

on:
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-14  # Apple Silicon runner (M1), macOS 14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: brew install portaudio

      - name: Install Python dependencies
        run: |
          pip install -r requirements_macos.txt
          pip install pyinstaller
          pip install --no-deps resemblyzer

      - name: Verify imports
        run: python -c "import PySide6, scipy, pyaudio, anthropic; print('All deps OK')"

      - name: Generate .icns icon
        run: python scripts/make_icns.py

      - name: Build main app
        run: pyinstaller app_macos.spec --clean --noconfirm

      - name: Build sender app
        run: pyinstaller sender_macos.spec --clean --noconfirm

      - name: Create distribution zip
        run: |
          cd dist
          zip -r -y "../AetherStack-Interview-Assistant-macOS.zip" "AetherStack Interview Assistant.app"
          zip -r -y "../AetherStack-Sender-macOS.zip" "AetherStack Sender.app"

      - name: Upload main app
        uses: actions/upload-artifact@v4
        with:
          name: AetherStack-Interview-Assistant-macOS
          path: AetherStack-Interview-Assistant-macOS.zip

      - name: Upload sender app
        uses: actions/upload-artifact@v4
        with:
          name: AetherStack-Sender-macOS
          path: AetherStack-Sender-macOS.zip
