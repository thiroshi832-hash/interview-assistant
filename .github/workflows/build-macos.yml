name: Build macOS app

on:
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-14  # Apple Silicon runner (M1), macOS 14

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          brew install portaudio
          brew install gcc
          brew install openblas

      - name: Download macOS 11-compatible binary wheels
        run: |
          mkdir -p wheels
          # pip on macOS 14 defaults to macOS 14/15 platform tags.
          # Force download of macOS 11 ARM64/universal2 wheels for packages
          # whose binary wheels contain native code (dylibs) that would
          # crash on macOS 11 if built against a newer SDK.
          PLATFORM_ARGS="--platform macosx_11_0_arm64 --platform macosx_11_0_universal2 --python-version 3.11 --only-binary :all: --no-deps -d ./wheels"
          for pkg in \
            "PySide6>=6.5,<6.6" \
            "PySide6-Essentials>=6.5,<6.6" \
            "PySide6-Addons>=6.5,<6.6" \
            "shiboken6>=6.5,<6.6" \
            "numpy>=1.26,<2" \
            "scipy>=1.11,<1.14" \
            "onnxruntime>=1.17,<1.20" \
          ; do
            echo "--- Downloading: $pkg ---"
            pip download $PLATFORM_ARGS "$pkg" || echo "WARN: no macOS 11 wheel for $pkg, will install normally"
          done
          ls -la wheels/

      - name: Install dependencies
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openblas/lib/pkgconfig
        run: |
          # Install the pre-downloaded macOS 11 wheels FIRST, with --no-index.
          # --find-links on its own only *adds* candidates — pip stays free to
          # resolve a newer release from PyPI, which is exactly how
          # onnxruntime 1.28 (macOS 14 SDK) got in and crashed Big Sur with
          # "Symbol not found: ...pmr25monotonic_buffer_resource...".
          pip install --no-index --no-deps --find-links ./wheels \
            PySide6 PySide6-Essentials PySide6-Addons shiboken6 \
            numpy onnxruntime

          # Everything else. scipy/scikit-learn have no genuine macOS 11
          # wheels (the macosx_11_0 tag is a lie — the binaries are built
          # against a newer SDK), so build them from source against
          # MACOSX_DEPLOYMENT_TARGET=11.0.
          pip install --find-links ./wheels --no-binary scipy,scikit-learn -r requirements_macos.txt
          pip install --find-links ./wheels pyinstaller
          pip install --find-links ./wheels --no-deps resemblyzer

      - name: Verify imports
        run: |
          # --no-deps above can leave transitive deps missing; surface that here.
          pip check
          python -c "import PySide6, scipy, numpy, pyaudio, anthropic, onnxruntime; print('All deps OK')"
          python -c "import onnxruntime, PySide6; print('onnxruntime', onnxruntime.__version__); print('PySide6', PySide6.__version__)"

      - name: Generate .icns icon
        run: python scripts/make_icns.py

      - name: Build main app
        run: pyinstaller app_macos.spec --clean --noconfirm

      - name: Build sender app
        run: pyinstaller sender_macos.spec --clean --noconfirm

      - name: Create distribution zip
        run: |
          cd dist
          zip -r -y "../AetherStack-Interview-Assistant-macOS.zip" "AetherStack Interview Assistant.app"
          zip -r -y "../AetherStack-Sender-macOS.zip" "AetherStack Sender.app"

      - name: Upload main app
        uses: actions/upload-artifact@v4
        with:
          name: AetherStack-Interview-Assistant-macOS
          path: AetherStack-Interview-Assistant-macOS.zip

      - name: Upload sender app
        uses: actions/upload-artifact@v4
        with:
          name: AetherStack-Sender-macOS
          path: AetherStack-Sender-macOS.zip

      # Runs after the uploads so a failure still leaves testable artifacts.
      # Reads LC_BUILD_VERSION out of every bundled Mach-O — the wheel's
      # platform tag can't be trusted, and a mismatch otherwise only shows up
      # as a dyld crash on the user's machine.
      - name: Verify every bundled binary runs on macOS 11
        run: python scripts/check_macos_min_version.py dist --max-version 11.0
