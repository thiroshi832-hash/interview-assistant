name: Build macOS app

on:
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    runs-on: macos-14  # Apple Silicon runner (M1), macOS 14

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          brew install portaudio
          brew install gcc

      - name: Download macOS 11-compatible binary wheels
        run: |
          mkdir -p wheels
          # pip on macOS 14 defaults to macOS 14/15 platform tags.
          # Force download of macOS 11 ARM64/universal2 wheels for packages
          # whose binary wheels contain native code (dylibs) that would
          # crash on macOS 11 if built against a newer SDK.
          PLATFORM_ARGS="--platform macosx_11_0_arm64 --platform macosx_11_0_universal2 --python-version 3.12 --only-binary :all: --no-deps -d ./wheels"
          for pkg in \
            "PySide6>=6.5,<6.6" \
            "PySide6-Essentials>=6.5,<6.6" \
            "PySide6-Addons>=6.5,<6.6" \
            "shiboken6>=6.5,<6.6" \
            "numpy>=1.26,<2" \
            "scipy>=1.11,<1.14" \
            "onnxruntime>=1.16" \
          ; do
            echo "--- Downloading: $pkg ---"
            pip download $PLATFORM_ARGS "$pkg" || echo "WARN: no macOS 11 wheel for $pkg, will install normally"
          done
          ls -la wheels/

      - name: Install dependencies
        run: |
          # Install from macOS 11 wheels first; packages not in ./wheels
          # are fetched normally (pure-Python or source build with
          # MACOSX_DEPLOYMENT_TARGET=11.0).
          pip install --find-links ./wheels -r requirements_macos.txt
          pip install --find-links ./wheels pyinstaller
          pip install --find-links ./wheels --no-deps resemblyzer

      - name: Verify imports
        run: python -c "import PySide6, scipy, numpy, pyaudio, anthropic; print('All deps OK')"

      - name: Generate .icns icon
        run: python scripts/make_icns.py

      - name: Build main app
        run: pyinstaller app_macos.spec --clean --noconfirm

      - name: Build sender app
        run: pyinstaller sender_macos.spec --clean --noconfirm

      - name: Create distribution zip
        run: |
          cd dist
          zip -r -y "../AetherStack-Interview-Assistant-macOS.zip" "AetherStack Interview Assistant.app"
          zip -r -y "../AetherStack-Sender-macOS.zip" "AetherStack Sender.app"

      - name: Upload main app
        uses: actions/upload-artifact@v4
        with:
          name: AetherStack-Interview-Assistant-macOS
          path: AetherStack-Interview-Assistant-macOS.zip

      - name: Upload sender app
        uses: actions/upload-artifact@v4
        with:
          name: AetherStack-Sender-macOS
          path: AetherStack-Sender-macOS.zip
